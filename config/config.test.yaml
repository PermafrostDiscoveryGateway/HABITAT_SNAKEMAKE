# Smoke test: one synthetic scene and an untrained model, generated by the
# make_test_data rule. Checks the workflow runs end to end; the output
# polygons are meaningless.
#   snakemake --configfile config/config.test.yaml --cores 2

habitat_dir: HABITAT

environment:
  path: .venv-habitat
  python: "3.10"

scene_dir: test_data/scenes
scenes: [synthetic_scene]
footprint: test_data/footprints/footprints.shp
weights: test_data/weights/untrained_unetpp.pth
output_dir: results/test

device: cpu
threads_per_scene: 2

model:
  size: 512
  overlap: 0.5
  classes: 3
  encoder: resnet50
