# Snakemake profile for NCSA Delta: each `process_scene` job (one scene) is a 1-GPU
# Slurm job; `build_environment` and `download_model` are small CPU jobs, so
# Slurm's accounting (sacct, scripts/benchmark_table.py) covers them too.
# `download_imagery` and `make_test_data` still run on the login node (see
# localrules in the Snakefile). Each rule's account, partition, memory, time
# and threads are set below; a rule without its own entry falls back to the
# GPU defaults, so give any new rule one. Needs snakemake >= 8 and
# snakemake-executor-plugin-slurm:
#   uv tool install snakemake --with snakemake-executor-plugin-slurm
# Use with config/config.delta.yaml (run_delta.sh passes both).

executor: slurm

# Max Slurm jobs queued/running at once.
jobs: 8

# Rules that run on the login node (download_imagery) at once. A whole
# Maxar tile takes ~8 GB to fetch and pansharpen, and login nodes are shared.
local-cores: 2

# Outputs are written on the compute node and checked from the login node.
latency-wait: 60

# A failed scene doesn't stop the others.
keep-going: true

default-resources:
  # Delta GPU allocation the jobs are charged to.
  slurm_account: "biyc-delta-gpu"
  # A40s are charged at 0.5x an A100 and are plenty for one 512 px tile at a
  # time. gpuA100x4 (1.0x) is the alternative.
  slurm_partition: "gpuA40x4"
  # Minutes (max 2880). Raise for scenes much larger than a 5 km tile.
  runtime: 60
  # HABITAT keeps every tile's prediction in memory until it stitches them
  # (~3 MB per tile), so full scenes need tens of GB. 60 GB stays within a
  # quarter of a node, matching 1 GPU and 16 cores.
  mem_mb: 60000

set-resources:
  process_scene:
    gpu: 1
    # Minutes. sacct for the 22 NWT tiles and the Yellowknife sample (whole
    # ~5 km Maxar tiles at most, 10,600 px): 29 to 310 s elapsed, peak host
    # memory 1.7 to 9.3 GiB, peak GPU memory up to 1.1 GiB, under one CPU core
    # on average. Short limits fit into backfill gaps and start sooner; raise
    # it for larger scenes. mem_mb stays at the default: a 1-GPU job is charged
    # as a quarter node anyway, so asking for less memory saves nothing.
    # Check each new run with scripts/benchmark_table.py (or
    # `sacct -j <jobid> --format=Elapsed,MaxRSS,TRESUsageInMax%110`).
    runtime: 10

  # CPU jobs. These use the CPU allocation and the cpu partition, not the GPU
  # defaults above. Measured on Delta with
  # `python3 scripts/benchmark_table.py --config config/config.delta.yaml`;
  # sacct reports MaxRSS in KiB, and Delta charges CPU jobs by cores or memory
  # share of the node, whichever is larger.
  #
  # The venv: `uv pip install` of a few GB of wheels (torch with its CUDA
  # libraries). With the venv already in place it took 15 s and 0.2 GiB
  # (2026-10-25). A build from scratch has not been measured, so the limits
  # leave room for it.
  build_environment:
    slurm_account: "biyc-delta-cpu"
    slurm_partition: "cpu"
    mem_mb: 8000
    runtime: 30
  # The ~187 MB model by curl, when the config gives a weights_url: 18 s and
  # 0.3 GiB on Delta (2026-10-25).
  download_model:
    slurm_account: "biyc-delta-cpu"
    slurm_partition: "cpu"
    mem_mb: 2000
    runtime: 10

# CPU cores per CPU job (Slurm --cpus-per-task); everything else takes 1, and
# process_scene takes threads_per_scene from the config.
set-threads:
  build_environment: 4
