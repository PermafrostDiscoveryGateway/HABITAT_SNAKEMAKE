# Real imagery, freely available: a 2 km x 2 km window of downtown
# Yellowknife, NWT, from Maxar Open Data (WorldView-3, 2023-08-08,
# CC BY-NC 4.0), pansharpened to HABITAT's 4-band layout by the
# download_imagery rule. Runs the real HABITAT model on it.
#   snakemake --configfile config/config.sample.yaml --cores 8

habitat_dir: HABITAT
# Fast-forward HABITAT to the latest origin/main before each run
# (docs/04-updating-habitat.md). Set to false to keep the pinned commit.
update_habitat: true

environment:
  path: .venv-habitat
  python: "3.10"

scene_dir: data/sample/scenes
scenes: [yellowknife_wv03_20230808]
footprint: null
no_data_value: 0

weights: data/model_weights/ResNet50-UNet++_512_0.5FTL_0.90A_0.75G_0.5CE_3class.pth
# Downloaded by the download_model rule if missing (HABITAT_model_weights
# Google Drive folder linked from HABITAT's README).
weights_url: https://drive.usercontent.google.com/download?id=1RW9YmjTa0CiRUJ4-vQraZS2F0rehCA_f&export=download&confirm=t
output_dir: results/sample

device: cpu
threads_per_scene: 8

model:
  size: 512
  overlap: 0.5
  classes: 3
  encoder: resnet50

# Scenes the download_imagery rule builds, keyed by scene name.
maxar_open_samples:
  yellowknife_wv03_20230808:
    ms_url: https://maxar-opendata.s3.amazonaws.com/events/NWT-Canada-Aug-23/ard/11/102020031231/2023-08-08/104001008B463900-ms.tif
    pan_url: https://maxar-opendata.s3.amazonaws.com/events/NWT-Canada-Aug-23/ard/11/102020031231/2023-08-08/104001008B463900-pan.tif
    lon: -114.365
    lat: 62.455
    size_m: 2048
